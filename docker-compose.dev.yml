# ============================================
# Aurora - local DEVELOPMENT environment
#
# Runs the Go backend and the Vite dev server in containers with the source
# bind-mounted, so edits on the host hot-reload in the browser.
#
#   Start:            docker compose -f docker-compose.dev.yml up -d
#   Logs:             docker compose -f docker-compose.dev.yml logs -f
#   Restart backend:  docker compose -f docker-compose.dev.yml restart backend   (after Go changes)
#   Stop:             docker compose -f docker-compose.dev.yml down
#
#   App:      http://localhost:5173
#   Backend:  http://localhost:8080
#
# Database / MQTT settings are read from the root .env file.
# ============================================

name: aurora-dev

services:
  backend:
    image: golang:1.24-alpine
    working_dir: /app
    command: go run ./cmd/server
    env_file: .env
    environment:
      CYBERUI_SERVER_HOST: 0.0.0.0
      CYBERUI_SERVER_PORT: "8080"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    # Dependencies live in a named volume: the host's node_modules holds
    # Windows binaries (esbuild) that cannot run in a Linux container.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      # Vite proxies /api to the backend container (see vite.config)
      API_PROXY_TARGET: http://backend:8080
      # File-change events do not cross the Windows -> Linux bind mount, so poll
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  go-mod-cache:
  go-build-cache:
  frontend-node-modules:
